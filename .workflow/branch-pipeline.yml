version: '1.0'
name: branch-pipeline
displayName: Branch Verification
stages:
  - stage:
    name: verify
    displayName: Verify branch
    steps:
      - step: build@python
        name: backend_gate
        displayName: Backend tests and dependency audit
        pythonVersion: '3.11'
        commands:
          - python3 -m pip install --upgrade pip
          - python3 -m pip install -r backend/requirements-ci.txt
          - python3 run_backend_tests.py
          - python3 -m pip_audit -r backend/requirements-build.txt
          - python3 -m compileall -q -x '\.venv' backend scripts run_prod.py run_backend_tests.py
          - python3 -m pip check
      - step: build@nodejs
        name: frontend_gate
        displayName: Frontend audit and production build
        nodeVersion: '22.12.0'
        dependsOn: backend_gate
        commands:
          - cd frontend && npm ci
          - cd frontend && npm run audit:production
          - cd frontend && npm run build
triggers:
  push:
    branches:
      exclude:
        - main
      include:
        - .*
